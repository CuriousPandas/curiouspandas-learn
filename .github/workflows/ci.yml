name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned, not ubuntu-latest: Ubuntu 26.04 replaced GNU coreutils with
    # uutils (Rust), whose error wording differs ("mkdir: d: File exists"), and
    # the shell parity test is defined against GNU coreutils - the tools the
    # Linux lessons teach. ubuntu-latest moved to 26.04 under us and failed it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The parity tests replay sessions through the real git binary; the
      # runner image ships git, and the tests fail (not skip) if it is missing.
      - run: npm test
      - run: npm run check
      - run: npm run build
      # Built once. Every browser job checks this dist and the pages job ships
      # it, so the site that was checked is the site that ships - no second
      # build that could differ from the one the browsers looked at.
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 3

  # One job per engine and per third of the check, side by side: nine jobs.
  # The engines used to run one after another in a single job (17.3 + 17.6 +
  # 13.7 minutes of a 52 minute run). Side by side, one engine was still 15 to
  # 17 minutes and set the length of the whole run, about 20 minutes, twice
  # per change (once on the pull request, once on main before the deploy).
  # Each engine's check is now dealt into SHARDS parts (scripts/lib/shard.mjs).
  browsers:
    needs: build
    runs-on: ubuntu-24.04
    env:
      SHARDS: 3
    strategy:
      # A WebKit failure is still worth seeing when Chromium has failed too.
      fail-fast: false
      matrix:
        # Chromium also runs the accessibility checks. WebKit is every browser
        # on an iPhone; it caught pod clicks that Chromium's faster synthetic
        # clicks slipped past.
        engine: [chromium, webkit, firefox]
        # Must list every part from 1 to SHARDS. The first step refuses a
        # list that does not.
        shard: [1, 2, 3]
    steps:
      # Three engines times SHARDS parts is the number of jobs there must be.
      # With `shard: [1, 2]` and SHARDS still 3, every job would pass and a
      # third of the site would be checked by nobody.
      - name: The job list covers every part
        run: test "${{ strategy.job-total }}" = "$((3 * SHARDS))"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      # Renders every page and drives every widget. A green build with a page
      # whose scripts throw is exactly what this exists to catch.
      - run: npm run check:site
        env:
          BROWSER: ${{ matrix.engine }}
          SHARD: ${{ matrix.shard }}/${{ env.SHARDS }}
      - uses: actions/upload-artifact@v7
        if: always()
        # Screenshots are evidence, not a gate. This step failing on GitHub's
        # side once skipped the Pages upload after every check had passed, and
        # a merged change sat undeployed. The checks above decide the result.
        continue-on-error: true
        with:
          name: site-check-${{ matrix.engine }}-${{ matrix.shard }}
          path: .site-check/
          # A dot-directory is "hidden" and upload-artifact skips hidden files
          # by default - the first run uploaded nothing and only warned.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  # Branch protection requires a check named "verify" (scripts/configure-repo.sh).
  # It is this job, so the rule keeps meaning "tests, build and all three
  # browsers passed". `if: always()` matters: a job skipped because its needs
  # failed reports as skipped, and a skipped required check does not block a
  # merge. This one always runs and fails unless everything before it passed.
  verify:
    needs: [build, browsers]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "build: ${{ needs.build.result }}, browsers: ${{ needs.browsers.result }}"
          test "${{ needs.build.result }}" = success
          test "${{ needs.browsers.result }}" = success
      # Only a merge to main publishes. Pull requests and manual runs verify
      # the same way and stop here; main itself only moves through a merged
      # pull request (scripts/configure-repo.sh).
      - uses: actions/download-artifact@v8
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: dist
          path: dist/
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist/

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
