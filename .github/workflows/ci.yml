name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Pinned, not ubuntu-latest: Ubuntu 26.04 replaced GNU coreutils with
    # uutils (Rust), whose error wording differs ("mkdir: d: File exists"), and
    # the shell parity test is defined against GNU coreutils - the tools the
    # Linux lessons teach. ubuntu-latest moved to 26.04 under us and failed it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The parity tests replay sessions through the real git binary; the
      # runner image ships git, and the tests fail (not skip) if it is missing.
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit firefox
      # Renders every page and drives every widget. A green build with a page
      # whose scripts throw is exactly what this exists to catch. Chromium also
      # runs the accessibility checks.
      - run: npm run check:site
      # WebKit is every browser on an iPhone. It caught pod clicks that
      # Chromium's faster synthetic clicks slipped past.
      - run: npm run check:site
        env: { BROWSER: webkit }
      - run: npm run check:site
        env: { BROWSER: firefox }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: site-check
          path: .site-check/
          # A dot-directory is "hidden" and upload-artifact skips hidden files
          # by default - the first run uploaded nothing and only warned.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      # The site that was just checked is the site that ships - no second build
      # that could differ from the one the browser check looked at.
      # Only a merge to main publishes. Pull requests and manual runs verify
      # the same way and stop here; main itself only moves through a merged
      # pull request (scripts/configure-repo.sh).
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist/

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
